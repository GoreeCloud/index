schema_version: '0.4'

component:
  type: application
  id: goreecloud-index
  product_name: GoreeCloud Index
  repository: GoreeCloud/index

lifecycle: development
version: 0.3.0-dev

supported_platforms:
  - android

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - CONFORMANCE.md
    notes: GoreeCloud Manager operational visibility is applicable to Index, but no accepted Manager runtime integration or Index operational-status publication exists.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - CONFORMANCE.md
      - PRIVACY POLICY.md
    notes: Index has fail-closed Privacy Shield decision projection and bounded downstream declarations, but no accepted producer-authoritative runtime adapter, user-decision lifecycle, or production acceptance.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - CONFORMANCE.md
      - SECURITY.md
    notes: Index constrains provider and result-action behavior but has no accepted Wardveil runtime security-evidence integration or production security acceptance.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - CONFORMANCE.md
    notes: Query state is transient and persistent query history is not implemented, but durable Index settings and future indexes require explicit continuity and recovery decisions before Stable qualification.
  glaze_ui:
    result: applicable-blocked
    version: '1.6.0'
    evidence:
      - README.md
      - CONFORMANCE.md
      - FEATURE-ROADMAP.md
      - app/src/main/java/com/goreecloud/index/ui/theme/GlazeV16Contract.kt
    notes: Candidate source targets current Official Stable GLAZE UI V1.6 / 1.6.0, but repository-local rendered/native accessibility, representative-device/form-factor, performance, Human Visual Excellence, rollback, release, and production acceptance remain incomplete.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - CONFORMANCE.md
    notes: Mesh-backed first-party provider discovery and coordination remain planned; no accepted Mesh registration, discovery, event, dependency, or runtime transport evidence exists for Index.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - CONFORMANCE.md
    notes: Index distinguishes Identity authorization from Android permission and Privacy Shield decisions, but no accepted Identity runtime authorization adapter, user/profile isolation, revocation, or production evidence exists.
  policy:
    result: applicable-blocked
    version: null
    evidence:
      - CONFORMANCE.md
    notes: GoreeCloud Policy is applicable to shared provider, authority, and execution policy decisions, but Index has not integrated or accepted producer-authoritative policy evaluation, freshness, explanation, enforcement, or policy evidence.
  observability:
    result: applicable-blocked
    version: null
    evidence:
      - CONFORMANCE.md
    notes: GoreeCloud Observability is applicable to runtime health, provider diagnostics, latency, failure/degradation evidence, and operational freshness, but no accepted Observability integration or health/readiness publication exists.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: false
    requirements: []
  restore:
    required: false
    requirements: []
  export:
    required: false
    requirements: []
  portability:
    required: false
    requirements: []

external_dependencies: []

compatibility:
  platform_contract: '0.4'
  glaze_ui_required: '1.6.0'
  requires:
    - goreecloud-platform-contract==0.4
    - glaze-ui==1.6.0
  provides:
    - index-local-provider-contract
    - index-search-action-contract

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - CONFORMANCE.md
    - ARCHITECTURE.md
    - CAPABILITIES.md
  blockers:
    - GoreeCloud Manager operational integration and acceptance are incomplete.
    - Producer-authoritative Privacy Shield runtime integration, user-decision lifecycle, and acceptance are incomplete.
    - Wardveil Security provider/action evidence integration and production security acceptance are incomplete.
    - Everkeep continuity and recovery requirements for durable Index state remain unaccepted.
    - Index candidate source targets current Stable GLAZE UI V1.6 / 1.6.0, but application-level rendered/native, accessibility, device/form-factor, performance, rollback, release, and production acceptance remain incomplete.
    - GoreeCloud Mesh provider discovery/coordination integration and runtime acceptance are incomplete.
    - GoreeCloud Identity authorization, isolation, revocation, and runtime acceptance are incomplete.
    - GoreeCloud Policy applicability is evaluated as applicable, but policy decision, enforcement, freshness, explanation, and evidence integration are not accepted.
    - GoreeCloud Observability applicability is evaluated as applicable, but health, diagnostics, performance, freshness, and operational evidence integration are not accepted.
    - Index exposes no accepted health/readiness interfaces.
    - Live GoreeCloud Search transport and user-facing Internet-provider controls are not enabled or accepted.
    - Representative Android device, accessibility, localization/RTL, form-factor/performance, production signing/distribution, rollback, recovery, and release-provenance acceptance are incomplete.
    - No Stable or production-approved GoreeCloud Index release evidence is declared.
