name: Linux quality gates

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (upstream verified)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (upstream verified)
        with:
          python-version: "3.12"
      - name: Install first-party package
        run: python -m pip install --no-deps -e .
      - name: Compile source and packaging utilities
        run: python -m compileall -q src tools tests
      - name: Run offline standard-library tests
        run: python -m unittest discover -s tests -v

  deb-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (upstream verified)
      - name: Build rootless Debian development candidate
        run: python3 tools/build_deb.py --output-dir dist
      - name: Inspect and unpack without installing
        shell: bash
        run: |
          set -euo pipefail
          package="dist/goreecloud-index_0.1.0-1_all.deb"
          dpkg-deb --field "$package" Package Version Architecture Depends
          dpkg-deb --contents "$package"
          sha256sum "$package"
          python3 tools/build_deb.py --output-dir dist --revision 2
          python3 -m tools.package_manifest "$package" \
            --compare-payload dist/goreecloud-index_0.1.0-2_all.deb \
            --output "$RUNNER_TEMP/goreecloud-index-package-inventory.json"
          python3 -m json.tool "$RUNNER_TEMP/goreecloud-index-package-inventory.json" > /dev/null
          mkdir -p "$RUNNER_TEMP/goreecloud-index-extracted"
          dpkg-deb -x "$package" "$RUNNER_TEMP/goreecloud-index-extracted"
          PYTHONPATH="$RUNNER_TEMP/goreecloud-index-extracted/usr/lib/python3/dist-packages" \
            /usr/bin/python3 -m goreecloud_index calc "12% of 75"

  deb-isolated-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (upstream verified)
      - name: Pull pinned Debian Python test container
        run: docker pull docker.io/library/python@sha256:1148dbb014615300fa7e713b2f94f550c0d1c69780c0805f84f093ceee34dd0b
      - name: Check package install, upgrade, rollback and purge in offline container
        run: |
          python3 tools/verify_deb_lifecycle.py --engine docker \
            --image docker.io/library/python@sha256:1148dbb014615300fa7e713b2f94f550c0d1c69780c0805f84f093ceee34dd0b

  deb-dependency-checked:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (upstream verified)
      - name: Build revision 1 and revision 2 Debian candidates
        run: |
          python3 tools/build_deb.py --output-dir dist --revision 1
          python3 tools/build_deb.py --output-dir dist --revision 2
      - name: Check signed Ubuntu dependency resolution, GTK runtime, upgrade, rollback and purge
        shell: bash
        run: bash tools/verify_deb_apt_runner.sh

  linux-gtk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (upstream verified)
      - name: Install native GTK runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb libxtst6 dbus
      - name: Smoke-test GTK window lifecycle under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          export GDK_BACKEND=x11
          xvfb-run -a /usr/bin/python3 tools/smoke_gtk.py
          # Only on a disposable hosted runner, test a true 640x360 logical
          # monitor rather than only shrinking the app inside a larger Xvfb.
          GOREECLOUD_INDEX_PRIVATE_XVFB=1 xvfb-run -a -s '-screen 0 640x360x24' \
            /usr/bin/python3 tools/smoke_windowed_gtk.py
          # GTK's deterministic accessibility backend checks native roles,
          # descriptions and active-descendant updates without a system bus.
          # This is not an AT-SPI or Orca screen-reader test.
          GTK_A11Y=test G_DEBUG=fatal-warnings xvfb-run -a /usr/bin/python3 tools/smoke_gtk.py
          # Private unconnected D-Bus and memory GSettings: preference tests
          # never alter the owner's desktop or activate a real portal backend.
          GTK_A11Y=test G_DEBUG=fatal-warnings xvfb-run -a /usr/bin/python3 tools/smoke_appearance_gtk.py
          xvfb-run -a /usr/bin/python3 tools/smoke_layout_gtk.py --width 390
          xvfb-run -a /usr/bin/python3 tools/smoke_layout_gtk.py --width 440
          # Simulate native 100/200/400% font preferences on a private
          # desktop. These are automated layout checks, not Orca acceptance.
          GTK_A11Y=test G_DEBUG=fatal-warnings xvfb-run -a /usr/bin/python3 tools/smoke_text_scale_gtk.py --width 390
          GTK_A11Y=test G_DEBUG=fatal-warnings xvfb-run -a /usr/bin/python3 tools/smoke_text_scale_gtk.py --width 440
          # Real X11 keyboard routing in a disposable Xvfb display only.
          # The test refuses the normal live desktop display and never runs
          # user applications or changes global keyboard bindings.
          GOREECLOUD_INDEX_PRIVATE_XVFB=1 xvfb-run -a /usr/bin/python3 tools/smoke_keyboard_x11.py
          # Test actual SCM_RIGHTS D-Bus fd transfer on a private session
          # bus with only a fake portal; never start desktop apps or connect
          # to the runner's normal portal service.
          for response in 0 1 2 error; do
            GOREECLOUD_INDEX_PORTAL_ISOLATED=1 GOREECLOUD_INDEX_FAKE_PORTAL="$response" \
              dbus-run-session -- /usr/bin/python3 tools/smoke_portal_fd.py
          done

  linux-wayland-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (upstream verified)
      - name: Install distribution-provided headless Wayland compositor and GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            weston python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 dbus
      - name: Run private Weston GTK native Wayland layout/consent/scaling smoke
        shell: bash
        run: bash tools/verify_weston_ci.sh

  qt-quick-preview:
    # Dedicated migration proof; GTK remains the legacy primary Linux UI.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (upstream verified)
      - name: Install headless Qt native display libraries
        # GitHub's minimal Ubuntu runner omits libEGL.so.1, required even for
        # Qt Quick's offscreen software QPA backend. Do not alter the host.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 \
            python3-gi dbus
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (upstream verified)
        with:
          python-version: "3.12"
      - name: Install hashed official Qt Quick 6.12.0 Essentials
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r tools/qtquick-linux-x86_64.requirements.txt
          python -m pip install --no-deps -e .
          python -c 'from PySide6.QtCore import qVersion; assert qVersion() == "6.12.0"'
      - name: Run isolated QML window and privacy-contract tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python -m unittest discover -s tests -p 'test_qtquick_preview.py' -v
          python -m unittest discover -s tests -p 'test_palette.py' -v
          python -m unittest discover -s tests -p 'test_portal_fd_lifetime.py' -v
          # No real desktop bus or handler: dbus-run-session owns a fresh,
          # private fake OpenFile portal. Synthetic rename/replacement proves
          # Qt timer -> GLib callback -> SCM_RIGHTS integration in 4 modes.
          for response in 0 1 2 error; do
            GOREECLOUD_INDEX_PORTAL_ISOLATED=1 \
              GOREECLOUD_INDEX_FAKE_PORTAL="$response" \
              PYTHONPATH=src:/usr/lib/python3/dist-packages \
              dbus-run-session -- python tools/smoke_qt_portal_fd.py
          done
