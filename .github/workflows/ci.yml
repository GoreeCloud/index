name: Linux quality gates

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install first-party package
        run: python -m pip install --no-deps -e .
      - name: Compile native-app Python modules
        run: python -m compileall -q src
      - name: Run offline standard-library tests
        run: python -m unittest discover -s tests -v

  linux-gtk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install native GTK runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
      - name: Smoke-test GTK import without installation or network
        run: |
          PYTHONPATH=src xvfb-run -a /usr/bin/python3 -c "from goreecloud_index.ui import IndexApplication; print('GTK application import OK')"
