name: Android Index foundation validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact source revision
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          mkdir -p build-evidence
          printf '%s\n' "$ACTUAL_SHA" | tee build-evidence/source-commit.txt

      - name: Repository contract validation
        run: python3 scripts/validate_repository.py

      - name: Settings provider boundary validation
        run: python3 scripts/validate_settings_provider.py

      - name: Approved branding validation
        run: python3 scripts/validate_branding.py

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.5.0'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest

      - name: Lint
        run: gradle :app:lintDebug

      - name: Assemble development APK
        run: gradle :app:assembleDebug

      - name: Verify development APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK" | tee build-evidence/app-debug.apk.sha256
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee build-evidence/app-debug.badging.txt
          grep -Fq "package: name='com.goreecloud.index.dev' versionCode='4' versionName='0.3.1-dev'" build-evidence/app-debug.badging.txt
          grep -Fq "application-label:'GoreeCloud Index Dev'" build-evidence/app-debug.badging.txt
          grep -Fq "uses-permission: name='android.permission.READ_CONTACTS'" build-evidence/app-debug.badging.txt
          grep -Fq "uses-permission: name='android.permission.INTERNET'" build-evidence/app-debug.badging.txt

      - name: Upload development APK evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: goreecloud-index-development-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build-evidence/source-commit.txt
            build-evidence/app-debug.apk.sha256
            build-evidence/app-debug.badging.txt
          if-no-files-found: error
          retention-days: 14
